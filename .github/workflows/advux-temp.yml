name: Search by stats in WebKit (temporary)
on:
  push:
    branches: [adv-panel]
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.52.0 && npx playwright install --with-deps webkit
      - run: node tests/advsearch-ux.cjs webkit
