name: Battle test (temporary)
# Temporary: runs tests/pages.cjs in WebKit (iPhone) and Firefox (desktop). Removed before the test suite merges.
on:
  push:
    branches: [battle-suite]
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        setup: [webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.52.0 && npx playwright install --with-deps ${{ matrix.setup }}
      - run: node tests/pages.cjs ${{ matrix.setup }} pages-${{ matrix.setup }}.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: pages-${{ matrix.setup }}
          path: pages-${{ matrix.setup }}.json
