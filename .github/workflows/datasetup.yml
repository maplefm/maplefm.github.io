name: Data branch setup
# One time: starts the live data branch fresh from the archived repository's latest data, with every private file
# encrypted (tools/vault.py) and no history. Run by hand.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Archived repository to copy the latest data from"
        default: "maplefm/clubfm-archive"
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q cryptography
          git clone -q --depth 1 --branch live "https://github.com/${{ github.event.inputs.from }}.git" /tmp/old
          mkdir -p /tmp/new/data && cp -r /tmp/old/data/. /tmp/new/data/
          cd /tmp/new
          rm -f data/*.enc
          # watcher signing keys were masked with the old INBOX_KEY; each watcher pins its key again on its next post
          python3 - <<'PY'
          import json
          p = "data/inbox_state.json"
          try:
              s = json.load(open(p))
              ids = s.get("ids") if isinstance(s, dict) else None
              for v in (ids or {}).values():
                  if isinstance(v, dict): v.pop("key", None)
              json.dump(s, open(p, "w"), separators=(",", ":"))
          except FileNotFoundError: pass
          PY
          T="$GITHUB_WORKSPACE/tools/vault.py"
          python3 "$T" pubsum .
          python3 "$T" bundle .
          python3 "$T" lock .
          cat > .gitignore <<'GI'
          # private data is committed only as <file>.enc (tools/vault.py); the plain copies never leave the job
          data/*.json
          !data/itemdb.json
          !data/names.json
          !data/summary-public.json
          !data/ranks.json
          !data/report.json
          !data/credits.json
          !data/maintenance.json
          !data/nexon_news.json
          !data/*-icons.json
          GI
          sed -i 's/^          //' .gitignore
          git init -q -b live
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git add -A
          # nothing private may go up in the clear
          bad=$(git ls-files | grep -E '^data/[^/]+\.json$' | grep -vE '^data/(itemdb|names|summary-public|ranks|report|credits|maintenance|nexon_news)\.json$|-icons\.json$' || true)
          if [ -n "$bad" ]; then echo "plain private files staged: $bad"; exit 1; fi
          git ls-files | sed 's/^/  /' | head -80
          git commit -q -m "Data branch, encrypted"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
