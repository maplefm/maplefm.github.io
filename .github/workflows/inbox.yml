name: Price inbox
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/inbox.py, .github/workflows/inbox.yml]
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
permissions:
  contents: write
env:
  INBOX_KEY: ${{ secrets.INBOX_KEY }}
  INBOX_PULL_KEY: ${{ secrets.INBOX_PULL_KEY }}
concurrency: inbox
jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
      - name: Unlock the data
        run: |
          pip install -q cryptography
          git fetch -q origin main && git show FETCH_HEAD:tools/vault.py > /tmp/vault.py
          python3 /tmp/vault.py unlock .
      - run: |
          git show origin/main:tools/inbox.py > /tmp/inbox.py 2>/dev/null || (git fetch origin main && git show FETCH_HEAD:tools/inbox.py > /tmp/inbox.py)
          mkdir -p data
          python3 /tmp/inbox.py /tmp/inbox.json data/inbox_block.json data/inbox_state.json
          if ! cmp -s /tmp/inbox.json data/inbox.json; then cp /tmp/inbox.json data/inbox.json; touch /tmp/changed; fi
      - run: |
          if [ -f /tmp/changed ]; then
            git config user.name maplefm
            git config user.email maplefm@users.noreply.github.com
            python3 /tmp/vault.py lock . && git add -A data
            git commit -m "Price inbox"
            for i in 1 2 3; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 5; done
          fi
