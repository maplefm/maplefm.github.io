name: Item list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/itemdb.py, .github/workflows/itemdb.yml]
  schedule:
    - cron: "17 9 * * *"
concurrency: itemdb
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the site's code branch only takes reviewed changes, so the refreshed list goes to the data branch
      - run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git fetch -q origin live
          git worktree add -q /tmp/live origin/live
          mkdir -p data /tmp/live/data
          python3 tools/itemdb.py data/itemdb.json
          cp data/itemdb.json /tmp/live/data/itemdb.json
          cd /tmp/live
          git add data/itemdb.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Refresh item list from maplestory.io"
          for i in 1 2 3 4 5; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 7; done
