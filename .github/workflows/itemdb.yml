name: Item list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/itemdb.py, .github/workflows/itemdb.yml]
  schedule:
    - cron: "17 9 * * 1"
concurrency: itemdb
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 tools/itemdb.py data/itemdb.json
      - run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git add data/itemdb.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Refresh item list from maplestory.io"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 7; done
