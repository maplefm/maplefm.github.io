name: Item guide
# Quests, drops, crafting and NPC shops for every item, shown at the bottom of each item card. Daily, so quests
# added to the game or the wiki show up on the board the next morning.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/itemguide.py, tools/drops_reported.json, .github/workflows/itemguide.yml]
  schedule:
    - cron: "41 9 * * *"
concurrency: itemguide
permissions:
  contents: write
  actions: write
env:
  DISCORD_HOOKS: ${{ secrets.DISCORD_HOOKS }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git fetch -q origin live
          git worktree add -q /tmp/live origin/live
          mkdir -p /tmp/live/data
          python3 tools/itemguide.py /tmp/itemguide.json /tmp/live/data/itemdb.json
          # never replace a good guide with an empty one when a source is down
          python3 -c "import json,sys; d=json.load(open('/tmp/itemguide.json')); sys.exit(0 if d['n'] >= 200 else 1)"
          cp /tmp/itemguide.json /tmp/live/data/itemguide.json
          cd /tmp/live
          grep -q '^!data/itemguide.json$' .gitignore || echo '!data/itemguide.json' >> .gitignore
          git add .gitignore data/itemguide.json
          git diff --cached --quiet && exit 0
          # new quests since the last guide: one plain line in #site-updates, then rebuild the quest and item pages now
          new=$(python3 - <<'PY'
          import json, subprocess
          try: old = json.loads(subprocess.run(["git", "show", "HEAD:data/itemguide.json"], capture_output=True, text=True).stdout or "{}")
          except Exception: old = {}
          have = {q["id"] for q in old.get("quests") or []}
          new = [q for q in json.load(open("data/itemguide.json")).get("quests") or [] if q["id"] not in have]
          if have and new: print("New quests on the Quest Log: " + ", ".join(f'{q["n"]} (Lv {q["lv"]})' for q in new[:12]) + (f" and {len(new) - 12} more" if len(new) > 12 else ""))
          PY
          )
          git commit -q -m "Refresh the item guide (quests, drops, crafting, shops)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 7; done
          cd "$GITHUB_WORKSPACE"
          if [ -n "$new" ]; then python3 tools/discord.py note "New quests" "$new\nSee them on https://maplefm.gg/quests.html" || true; fi
          gh api -X POST repos/${{ github.repository }}/actions/workflows/itempages.yml/dispatches -f ref=main || true
        env:
          GH_TOKEN: ${{ github.token }}
