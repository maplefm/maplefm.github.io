name: Item pages
on:
  workflow_dispatch:
  schedule:
    - cron: "29 10 * * *"
concurrency: itempages
permissions:
  contents: write
  pull-requests: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # one page per priced item for search engines; the numbers refresh live on open, this keeps the baked copy close
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          curl -fsSL https://raw.githubusercontent.com/maplefm/maplefm.github.io/live/data/summary-public.json -o /tmp/summary.json
          curl -fsSL https://raw.githubusercontent.com/maplefm/maplefm.github.io/live/data/itemguide.json -o /tmp/itemguide.json || echo '{"items":{}}' > /tmp/itemguide.json
          curl -fsSL https://raw.githubusercontent.com/maplefm/maplefm.github.io/live/data/world.json -o /tmp/world.json || rm -f /tmp/world.json
          python3 tools/itempages.py /tmp/summary.json . /tmp/itemguide.json /tmp/world.json assets/training-notes.json
          python3 tools/recap.py /tmp/summary.json . /tmp/recap.json
          # share images live on the data branch, redrawn only when an item's price line changes
          pip install -q pillow
          git fetch -q origin live
          git worktree add -q /tmp/live origin/live
          python3 tools/ogimages.py /tmp/summary.json /tmp/live /tmp/recap.json /tmp/world.json
          # the site's own copy of every item icon (/i/<id>.png): only new items are fetched
          python3 tools/iconmirror.py /tmp/live/data/itemdb.json i /tmp/itemguide.json || true
          (cd /tmp/live && git add og && (git diff --cached --quiet || (git commit -q -m "Share images" && for i in 1 2 3 4 5; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 7; done)))
          python3 tools/indexnow.py sitemap.xml || true
          git add -A item items map monster quest training maps monsters quests crafting recap sitemap.xml data/mobs.json index.html i data/play.json
          git diff --cached --quiet && exit 0
          b=item-pages-$(date -u +%Y%m%d)
          git checkout -q -b "$b"
          git commit -q -m "item pages: daily refresh"
          git push -q -f origin "$b"
          n=$(gh pr create --base main --head "$b" --title "item pages: daily refresh" --body "Daily rebuild of the item price pages." | grep -o '[0-9]*$')
          gh pr merge "$n" --rebase --delete-branch
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
