name: Site updates
# Posts what landed on main to the Club FM Discord #site-updates: site changes and FM Watcher releases.
on:
  push:
    branches: [main]
  schedule:
    - cron: "5 22 * * *"       # one plain note a day at about 6 PM Eastern, when there is something to say
  workflow_dispatch:
    inputs:
      title:
        description: "Post a note to #site-updates: title"
        required: false
      text:
        description: "Post a note to #site-updates: body (use \\n for new lines)"
        required: false
permissions:
  contents: write
concurrency: news
env:
  DISCORD_HOOKS: ${{ secrets.DISCORD_HOOKS }}
jobs:
  news:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Browser for the page pictures (daily digest only)
        if: github.event_name == 'schedule'
        run: pip install -q playwright pillow && python3 -m playwright install --with-deps chromium >/dev/null
      - env:
          NOTE_TITLE: ${{ github.event.inputs.title }}
          NOTE_TEXT: ${{ github.event.inputs.text }}
        run: |
          git config --global user.name maplefm
          git config --global user.email maplefm@users.noreply.github.com
          # what was already announced is kept in the private data repository
          git clone -q --depth 1 -b live "https://x-access-token:${ARCHIVE_TOKEN}@github.com/maplefm/clubfm-archive.git" /tmp/arch
          mkdir -p /tmp/arch/data
          [ -f /tmp/arch/data/discord_news.json ] && cp /tmp/arch/data/discord_news.json /tmp/news.json || echo '{}' > /tmp/news.json
          if [ -n "$NOTE_TEXT" ]; then python3 tools/discord.py note "$NOTE_TITLE" "$NOTE_TEXT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then python3 tools/discord.py news /tmp/news.json; mkdir -p /tmp/arch/data/shots; SHOTS_DIR=/tmp/arch/data/shots python3 tools/discord.py digest /tmp/news.json
          else python3 tools/discord.py news /tmp/news.json; fi
          cp /tmp/news.json /tmp/arch/data/discord_news.json
          cd /tmp/arch && git add data/discord_news.json && git add -A data/shots 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Site updates state"
          for i in 1 2 3 4 5; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 7; done
