name: Scanner ranks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/ranks.py, .github/workflows/ranks.yml]
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: write
concurrency: ranks
jobs:
  ranks:
    runs-on: ubuntu-latest
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
      - name: Unlock the data
        run: |
          pip install -q cryptography
          git fetch -q origin main && git show FETCH_HEAD:tools/vault.py > /tmp/vault.py
          python3 /tmp/vault.py unlock .
      - run: |
          git show origin/main:tools/ranks.py > /tmp/ranks.py 2>/dev/null || (git fetch origin main && git show FETCH_HEAD:tools/ranks.py > /tmp/ranks.py)
          mkdir -p data
          python3 /tmp/ranks.py data data/ranks.json
      - run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git add data/ranks.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Scanner ranks"
          for i in 1 2 3 4 5; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 7; done
