name: Market report
on:
  workflow_dispatch:
  schedule:
    # 11:55 PM Eastern in daylight time and in standard time (the script picks the Eastern day being closed)
    - cron: "55 3 * * *"
    - cron: "55 4 * * *"
concurrency: report
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DISCORD_HOOKS: ${{ secrets.DISCORD_HOOKS }}
      ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
      - name: Browser for the report PDF
        run: pip install -q playwright==1.56.0
      # the working data is in the private repository; the finished report is public
      - run: |
          git config --global user.name maplefm
          git config --global user.email maplefm@users.noreply.github.com
          git fetch -q origin main && git worktree add -q /tmp/main origin/main
          git clone -q -b live "https://x-access-token:${ARCHIVE_TOKEN}@github.com/maplefm/clubfm-archive.git" /tmp/arch
          cd /tmp/arch && mkdir -p data
          python3 /tmp/main/tools/report.py data /tmp/main/data/itemdb.json data/report.json
          timeout 240 python3 /tmp/main/tools/reportpdf.py /tmp/main data/report.json /tmp/market-close.pdf || echo "no PDF this time"
          python3 /tmp/main/tools/discord.py report data/report.json data/discord_report.json /tmp/market-close.pdf || true
          python3 /tmp/main/tools/discord.py coverage data data/discord_coverage.json || true
          git add -A data
          if ! git diff --cached --quiet; then git commit -q -m "Market close report"; for i in 1 2 3 4 5; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 7; done; fi
          cd "$GITHUB_WORKSPACE"
          cp /tmp/arch/data/report.json data/report.json
          MAIN_DIR=/tmp/main python3 /tmp/main/tools/discord.py potd data/summary-public.json data/discord_potd.json || true
          git add data/report.json data/discord_potd.json 2>/dev/null || git add data/report.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Market close report"
          for i in 1 2 3 4 5; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 7; done
