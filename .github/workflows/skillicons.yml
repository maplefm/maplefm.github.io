name: Skill icons
# Copies every Classic skill icon from maplestory.io into sk/<id>.png so build guides never show a broken picture.
on:
  workflow_dispatch:
  push:
    branches: [build-guides]
    paths: [.github/workflows/skillicons.yml, assets/classic-skills.json, builds/*.json, builds/tools/spotcheck.py]
permissions:
  contents: write
concurrency: skillicons
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sk
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request
          sys.path.insert(0, "tools")
          import mcwver
          IO = mcwver.base().rstrip("/")
          print("base", IO, flush=True)
          UA = {"User-Agent": "maplefm.gg icon copy"}
          def raw(u, t=25):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t).read()
          skills = json.load(open("assets/classic-skills.json"))["skills"]
          jobs = sorted({v["job"] for v in skills.values()})
          got, shown = 0, False
          PREREQ = {}
          def save(sid, b):
              global got
              if b[:8] == b"\x89PNG\r\n\x1a\n":
                  open(f"sk/{sid}.png", "wb").write(b); got += 1; return True
              return False
          for j in jobs:
              try: book = json.loads(raw(f"{IO}/job/{j}/skillbook", 40))
              except Exception as e: print("book", j, e); continue
              for sk in book.get("skills", []):
                  sid = str(sk["id"])
                  if sid in skills:
                      rq = sk.get("requiredSkillLevels") or sk.get("requiredSkills") or {}
                      if isinstance(rq, list): rq = {str(x.get("id") or x.get("skillId")): x.get("level") for x in rq if isinstance(x, dict)}
                      PREREQ[sid] = {str(k): v for k, v in (rq or {}).items()}
                  if sid not in skills or os.path.exists(f"sk/{sid}.png"): continue
                  if not shown:
                      print("skill keys", sorted(sk.keys()), flush=True); shown = True
                  done = False
                  for k in ("iconRaw", "icon", "iconMouseOver", "iconDisabled"):
                      v = sk.get(k)
                      if isinstance(v, str) and len(v) > 100:
                          try: done = save(sid, base64.b64decode(v.split(",")[-1]))
                          except Exception: pass
                      if done: break
                  if done: continue
                  for u in (f"{IO}/skill/{sid}/icon", f"{IO}/wz/Skill/{j:03d}.img/skill/{sid}/icon?export=true", f"{IO}/wz/Skill/{j}.img/skill/{sid}/icon?export=true",
                            f"{IO}/job/{j}/skill/{sid}/icon"):
                      try:
                          if save(sid, raw(u)): done = True; print(sid, "via", u.split(IO)[1], flush=True); break
                      except Exception as e: pass
                  if not done: print(sid, "miss", flush=True)
          miss = sorted(s for s in skills if not os.path.exists(f"sk/{s}.png"))
          json.dump(miss, open("sk/missing.json", "w"))
          os.makedirs("builds/data", exist_ok=True)
          json.dump({"source": IO + "/job/<job>/skillbook requiredSkillLevels", "skills": PREREQ}, open("builds/data/prereqs.json", "w"), indent=0, sort_keys=True)
          print("prereqs", len(PREREQ), "with a requirement", sum(1 for v in PREREQ.values() if v))
          print("copied", got, "missing", len(miss))
          PY
      - run: |
          mkdir -p builds/data
          python3 - <<'PY'
          import json, sys, urllib.request
          sys.path.insert(0, "tools")
          import mcwver
          IO = mcwver.base().rstrip("/")
          UA = {"User-Agent": "maplefm.gg game data"}
          db = {r[0]: r[1] for r in json.load(open("data/itemdb.json"))["items"]} if __import__("os").path.exists("data/itemdb.json") else {}
          if not db:
              db = {r[0]: r[1] for r in json.loads(urllib.request.urlopen("https://raw.githubusercontent.com/maplefm/maplefm.github.io/live/data/itemdb.json", timeout=60).read())["items"]}
          ammo = json.load(open("assets/classic-skills.json"))["ammo"]
          out = {}
          for kind, rows in ammo.items():
              for name, atk in rows:
                  iid = db.get(name)
                  rec = {"kind": kind, "id": iid, "atk": atk}
                  if iid:
                      try:
                          j = json.loads(urllib.request.urlopen(urllib.request.Request(f"{IO}/item/{iid}", headers=UA), timeout=40).read())
                          m = j.get("metaInfo") or {}
                          rec.update({"reqLevel": m.get("reqLevel"), "slotMax": m.get("slotMax"), "incPAD": m.get("incPAD"), "price": m.get("price"), "unitPrice": m.get("unitPrice"), "keys": sorted(m)[:40]})
                      except Exception as e:
                          rec["err"] = str(e)[:80]
                  out[name] = rec
                  print(name, rec, flush=True)
          json.dump(out, open("builds/data/ammo.json", "w"), indent=1)
          PY
      - run: |
          python3 - <<'PY'
          import json, sys, urllib.request
          sys.path.insert(0, "tools")
          import mcwver
          IO = mcwver.base().rstrip("/")
          UA = {"User-Agent": "maplefm.gg game data"}
          db = {}
          for r in json.loads(urllib.request.urlopen("https://raw.githubusercontent.com/maplefm/maplefm.github.io/live/data/itemdb.json", timeout=60).read())["items"]:
              db.setdefault(r[0], r[1])
          W = json.load(open("assets/classic-skills.json"))["weapons"]
          out = {}
          for kind, rows in W.items():
              for w in rows:
                  name = w[0]; iid = db.get(name)
                  rec = {"kind": kind, "id": iid, "lv": w[1], "watk": w[2], "spd": w[4]}
                  if iid:
                      try:
                          m = json.loads(urllib.request.urlopen(urllib.request.Request(f"{IO}/item/{iid}", headers=UA), timeout=40).read()).get("metaInfo") or {}
                          rec.update({k: m.get(k) for k in ("reqLevel", "reqSTR", "reqDEX", "reqINT", "reqLUK", "reqJob", "incPAD", "incMAD", "attackSpeed", "tuc", "price", "cash")})
                      except Exception as e:
                          rec["err"] = str(e)[:80]
                  out[name] = rec
          json.dump(out, open("builds/data/weapons.json", "w"), indent=0)
          print("weapons", len(out), sum(1 for v in out.values() if "reqLevel" in v))
          PY
      - run: python3 builds/tools/spotcheck.py
      - run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git add -A sk builds/data builds/check
          git diff --cached --quiet && exit 0
          git commit -q -m "Skill icons"
          git push -q origin HEAD:build-guides
