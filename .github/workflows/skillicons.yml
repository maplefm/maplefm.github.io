name: Skill icons
# Copies every Classic skill icon from maplestory.io into sk/<id>.png so build guides never show a broken picture.
on:
  workflow_dispatch:
  push:
    branches: [build-guides]
    paths: [.github/workflows/skillicons.yml, assets/classic-skills.json]
permissions:
  contents: write
concurrency: skillicons
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sk
          python3 - <<'PY'
          import json, os, urllib.request, concurrent.futures as cf
          ids = sorted(json.load(open("assets/classic-skills.json"))["skills"])
          URLS = ["https://maplestory.io/api/MCW/1/skill/{}/icon", "https://maplestory.io/api/MCW/1.2/skill/{}/icon", "https://maplestory.io/api/GMS/83/skill/{}/icon"]
          def get(i):
              p = f"sk/{i}.png"
              if os.path.exists(p): return i, "have"
              errs = []
              for u in URLS:
                  try:
                      b = urllib.request.urlopen(urllib.request.Request(u.format(i), headers={"User-Agent": "maplefm.gg icon copy"}), timeout=15).read()
                      if b[:8] == b"\x89PNG\r\n\x1a\n":
                          open(p, "wb").write(b); return i, "ok " + u.split("/api/")[1].split("/skill")[0]
                      errs.append("not png")
                  except Exception as e:
                      errs.append(str(e)[:60])
              return i, "miss " + " | ".join(errs)
          res = list(cf.ThreadPoolExecutor(8).map(get, ids))
          for i, r in res: print(i, r, flush=True)
          json.dump(sorted(i for i, r in res if r.startswith("miss")), open("sk/missing.json", "w"))
          print("copied", sum(r.startswith("ok") for _, r in res), "missing", sum(r.startswith("miss") for _, r in res))
          PY
      - run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git add -A sk
          git diff --cached --quiet && exit 0
          git commit -q -m "Skill icons"
          git push -q origin HEAD:build-guides
