name: Skill icons
# Copies every Classic skill icon from maplestory.io into sk/<id>.png so build guides never show a broken picture.
on:
  workflow_dispatch:
  push:
    branches: [build-guides]
    paths: [.github/workflows/skillicons.yml, assets/classic-skills.json]
permissions:
  contents: write
concurrency: skillicons
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sk
          python3 - <<'PY'
          import json, os, time, urllib.request
          ids = sorted(json.load(open("assets/classic-skills.json"))["skills"])
          got, miss = 0, []
          for i in ids:
              p = f"sk/{i}.png"
              if os.path.exists(p): continue
              for url in (f"https://maplestory.io/api/MCW/1/skill/{i}/icon", f"https://maplestory.io/api/MCW/1.2/skill/{i}/icon"):
                  try:
                      b = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "maplefm.gg icon copy"}), timeout=30).read()
                      if b[:8] == b"\x89PNG\r\n\x1a\n":
                          open(p, "wb").write(b); got += 1; break
                  except Exception as e:
                      err = str(e)
                  time.sleep(0.3)
              else:
                  miss.append(i)
          json.dump(sorted(miss), open("sk/missing.json", "w"))
          print("copied", got, "missing", len(miss), miss[:20])
          PY
      - run: |
          git config user.name maplefm
          git config user.email maplefm@users.noreply.github.com
          git add -A sk
          git diff --cached --quiet && exit 0
          git commit -q -m "Skill icons"
          git push -q origin HEAD:build-guides
