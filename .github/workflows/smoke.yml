name: Smoke test
# every page at phone and desktop width in a real browser, on each change to the site
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "item/**", "map/**", "monster/**", "quest/**", "recap/**", "og/**", "sitemap.xml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Browser
        # Nov 11: the Azure apt mirror stalled and --with-deps hung the whole job on apt. The runner image
        # already carries Chromium's libraries, so download the browser alone and only reach for apt if it
        # cannot launch.
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install chromium
          if node -e "require('playwright').chromium.launch().then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})"; then
            echo "chromium launches without apt"
          else
            timeout -k 10 600 sudo -E env "PATH=$PATH" npx playwright install-deps chromium
          fi
      - name: Board ships the minified, hash-stamped files
        # a debug switch (board.js?dbg=1) sat on the live board for four days in Oct and Nov: bigger download, no cache stamp
        run: |
          grep -q 'src="/assets/board.min.js?v=[0-9a-f]\{8\}"' index.html || { echo "index.html must load /assets/board.min.js?v=<hash>; run tools/bust.py"; exit 1; }
      - name: Page builders compile and run
        # a broken builder stopped the daily item, quest and map pages for two days in October; catch it before merge
        run: |
          for f in tools/*.py; do python3 -m py_compile "$f"; done
          L=https://raw.githubusercontent.com/maplefm/maplefm.github.io/live/data
          for f in world itemguide summary-public; do curl -fsSL "$L/$f.json" -o /tmp/$f.json; done
          mkdir -p /tmp/wp/item && python3 tools/worldpages.py /tmp/world.json /tmp/itemguide.json /tmp/summary-public.json assets/training-notes.json /tmp/wp
          test "$(ls /tmp/wp/quest | wc -l)" -gt 200 && test "$(ls /tmp/wp/map | wc -l)" -gt 200
          # the item pages too (they build the quest and map pages as well): a broken item page build left new quests,
          # like the Halloween event, off the site for hours on Oct 31
          mkdir -p /tmp/ip/item && cp item/*.css item/*.js /tmp/ip/item/
          python3 tools/itempages.py /tmp/summary-public.json /tmp/ip /tmp/itemguide.json /tmp/world.json assets/training-notes.json
          test "$(ls /tmp/ip/item | wc -l)" -gt 500
      - run: node tools/smoke.cjs
      - name: Every indexable page names its canonical address
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for f in glob.glob("*.html") + glob.glob("*/index.html") + glob.glob("*/*/index.html"):
              s = open(f, encoding="utf-8").read()
              if f.startswith(("download/", "assets/")) or re.search(r'name="robots" content="noindex', s) or "google-site-verification" in s or f.startswith("google"):
                  continue
              if 'rel="canonical"' not in s: bad.append(f)
          print("pages missing a canonical link:", bad or "none")
          sys.exit(1 if bad else 0)
          PY
