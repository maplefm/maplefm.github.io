name: Smoke test
# every page at phone and desktop width in a real browser, on each change to the site
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "item/**", "map/**", "monster/**", "quest/**", "recap/**", "og/**", "sitemap.xml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Browser
        # Nov 11: the Azure apt mirror stalled and --with-deps hung the whole job on apt. The runner image
        # already carries Chromium's libraries, so download the browser alone and only reach for apt if it
        # cannot launch.
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install chromium
          if node -e "require('playwright').chromium.launch().then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})"; then
            echo "chromium launches without apt"
          else
            timeout -k 10 600 sudo -E env "PATH=$PATH" npx playwright install-deps chromium
          fi
      - name: Board ships the minified, hash-stamped files
        # a debug switch (board.js?dbg=1) sat on the live board for four days in Oct and Nov: bigger download, no cache stamp
        run: |
          grep -q 'src="/assets/board.min.js?v=[0-9a-f]\{8\}"' index.html || { echo "index.html must load /assets/board.min.js?v=<hash>; run tools/bust.py"; exit 1; }
      - name: Page builders compile and run
        # a broken builder stopped the daily item, quest and map pages for two days in October; catch it before merge
        run: |
          for f in tools/*.py; do python3 -m py_compile "$f"; done
          L=https://raw.githubusercontent.com/maplefm/maplefm.github.io/live/data
          for f in world itemguide summary-public; do curl -fsSL "$L/$f.json" -o /tmp/$f.json; done
          mkdir -p /tmp/wp/item && python3 tools/worldpages.py /tmp/world.json /tmp/itemguide.json /tmp/summary-public.json assets/training-notes.json /tmp/wp
          test "$(ls /tmp/wp/quest | wc -l)" -gt 200 && test "$(ls /tmp/wp/map | wc -l)" -gt 200
          # the item pages too (they build the quest and map pages as well): a broken item page build left new quests,
          # like the Halloween event, off the site for hours on Oct 31
          mkdir -p /tmp/ip/item && cp item/*.css item/*.js /tmp/ip/item/
          python3 tools/itempages.py /tmp/summary-public.json /tmp/ip /tmp/itemguide.json /tmp/world.json assets/training-notes.json
          test "$(ls /tmp/ip/item | wc -l)" -gt 500
      # Nov 28 2026: the accuracy report counts rows by the board's own limits; fixed cases catch a limit that drifts
      - name: Accuracy checks
        run: python3 tests/accuracy.py
      # Nov 19 2026: the pages use the width of the screen; every link on them must land, and the map tools must work
      - name: Built pages link only to pages that exist
        run: python3 tests/links.py /tmp/ip
      - name: Built pages show columns, phone tabs, numbered exits and Directions
        run: node tests/pages-ux.cjs /tmp/ip
      - run: node tools/smoke.cjs
      # Search by stats used like a person on a phone: shipped once with a + button that piled "1 att" into the box
      - name: Search by stats works when tapped and typed
        run: node tests/advsearch-ux.cjs chromium
      # Nov 16: the Biggest mover showed Two-Handed Sword at 149K, built from scroll listings whose cut-off name was read as
      # the sword. What a strip, pick or badge shows must be what it opens, and only sure prices headline.
      - name: Front page shows what it opens, sure prices only
        run: |
          node tests/frontdoor-ux.cjs chromium phone
          node tests/frontdoor-ux.cjs chromium desktop
      - name: Searches players type find the item meant
        run: |
          node tests/search-ux.cjs chromium phone
          node tests/search-ux.cjs chromium desktop
      - name: Search the site, phone and desktop
        run: |
          node tests/sitesearch-ux.cjs chromium phone
          node tests/sitesearch-ux.cjs chromium desktop
      # Nov 25: scrolling the board felt choppy. Rows keep arriving while scrolling, icons load with their row, the Big
      # sales strip holds still during a scroll, and a card opens and closes back to the same place.
      - name: Board scrolls smoothly, phone and desktop
        run: |
          node tests/smooth-ux.cjs chromium phone
          node tests/smooth-ux.cjs chromium desktop
      # Nov 18: the Zenith world opened with its own economy. One button switches the board; Zenith scans never
      # reach Windia's prices, reports or Discord posts.
      - name: World button shows one world's prices
        run: |
          node tests/world-ux.cjs chromium phone
          node tests/world-ux.cjs chromium desktop
      - name: Cut-off names never price the shorter item
        run: |
          # the runner's Python is system-managed (PEP 668), so pip needs leave to install
          python3 -m pip install -q --break-system-packages playwright==1.56.0 pillow numpy
          # no Playwright Chromium for this Ubuntu yet: tools/snapshot.py uses the runner's own Google Chrome first
          which google-chrome || python3 -m playwright install chromium
          python3 tests/cutnames.py --board
      # after the step above installs Pillow and numpy, which the watcher imports
      - name: Zenith scans stay out of Windia
        run: python3 tests/worlds.py
      # Nov 18: v2.0 data newer than maplestory.io (tools/gamepatch.json): new monsters reach the pages, changed
      # defense is never shown as fact, closed-test drop reports stay out
      - name: Patch data newer than the game files
        run: python3 tests/v2patch.py
      - name: Wiki quest prerequisites
        run: python3 tests/wikiquestpre.py
      - name: Training map simulator checks (hand-made maps with known answers)
        run: node tests/trainsim-check.cjs
      - name: Mega Deals repeat rules (one post per seller and item a day, a cap per item)
        run: python3 tests/deals-repeat.py
      # Nov 25: megaphones and smegas read off streams: found by colour, read once, counted once, asks only
      - name: Megaphones (stream reader, Discord, pulse, inbox, the board on a made-up market)
        run: python3 tests/megaphones.py --board
      - name: Every indexable page names its canonical address
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for f in glob.glob("*.html") + glob.glob("*/index.html") + glob.glob("*/*/index.html"):
              s = open(f, encoding="utf-8").read()
              if f.startswith(("download/", "assets/")) or re.search(r'name="robots" content="noindex', s) or "google-site-verification" in s or f.startswith("google"):
                  continue
              if 'rel="canonical"' not in s: bad.append(f)
          print("pages missing a canonical link:", bad or "none")
          sys.exit(1 if bad else 0)
          PY
