name: Watchdog
# Every 15 minutes: checks the site, !price and the data pipeline, repairs what can repair itself,
# and writes data/watchdog.json on live. The Worker DMs the admins when that file shows a change.
on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
permissions:
  contents: write
  actions: write
concurrency: watchdog
jobs:
  check:
    runs-on: ubuntu-24.04   # Playwright WebKit (the iPhone check) has no build for 26.04 yet
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
      - name: Month for the WebKit library cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore WebKit's libraries from cache
        # Nov 10 01:28 UTC: the Azure mirror crawled again (both apt tries ran out mid-download, phone
        # check red). Keep the downloaded .deb files between runs so apt only fetches what changed.
        id: debcache
        uses: actions/cache/restore@v4
        with:
          path: ~/webkit-debs
          key: webkit-debs-noble-pw1.56.0-${{ steps.month.outputs.month }}
          restore-keys: webkit-debs-noble-pw1.56.0-
      - name: Browser for the board checks
        id: browser
        # apt on the runner sometimes hangs for the whole job (Nov 4: two runs cancelled at 14 min,
        # no status written). Cap it so the other checks always run and report.
        timeout-minutes: 8
        continue-on-error: true
        # Nov 5 22:00 UTC: apt hung the whole step; "| tail" kept waiting on apt's children, so the
        # timeouts never ended it and WebKit itself was never downloaded. Download WebKit first (no apt),
        # log to a file instead of a pipe, and kill hard so every attempt fits inside the step.
        # Nov 6: the Azure mirror crawls on the font packages, so 100s cut try 1 mid-download and the
        # killed apt left its lock behind, failing try 2 at once (exit 100). Give try 1 longer, make apt
        # retry stalled downloads, and clear the dead apt and its lock before try 2.
        # Nov 6 evening: both tries still ran out on the font packages (ipafont, freefont, unifont,
        # several MB each from a crawling mirror). WebKit launches without them, so install only the
        # libraries first and keep the full install-deps as a fallback.
        run: |
          pip install -q playwright==1.56.0
          timeout -k 10 90 python3 -m playwright install webkit > /tmp/pw-install.log 2>&1 || echo "webkit download failed or timed out"
          tail -2 /tmp/pw-install.log
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/80-watchdog > /dev/null
          clear_apt() {
            sudo pkill -9 -x 'apt|apt-get|dpkg|http|https' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a > /dev/null 2>&1 || true
          }
          pkgs=$(sudo -E env "PATH=$PATH" python3 -m playwright install-deps --dry-run webkit 2>/dev/null \
            | grep -o 'no-install-recommends[^"]*' | head -1 | cut -d' ' -f2- | tr ' ' '\n' \
            | grep -vE '^(x?fonts-|ttf-)' | grep -E '^[a-z0-9][a-z0-9.+:-]*$' | tr '\n' ' ')
          echo "libraries without fonts: $(echo $pkgs | wc -w)"
          if ls ~/webkit-debs/*.deb > /dev/null 2>&1; then
            sudo cp ~/webkit-debs/*.deb /var/cache/apt/archives/ && echo "cached libraries: $(ls ~/webkit-debs/*.deb | wc -l) files"
          fi
          ok=
          # the cached libraries install straight from their files, no apt-get update: on Nov 11 the Azure mirror hung
          # in update and fetched newer versions, so the cache never got used and the phone check couldn't run
          if ls ~/webkit-debs/*.deb > /dev/null 2>&1 && timeout -k 10 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-download --no-install-recommends ~/webkit-debs/*.deb > /tmp/pw-deps.log 2>&1; then
            ok=1; echo "installed from the cache"; tail -1 /tmp/pw-deps.log
          fi
          if [ -z "$ok" ]; then
            if [ -n "$pkgs" ] && timeout -k 10 240 sudo env DEBIAN_FRONTEND=noninteractive sh -c "apt-get update -q && apt-get install -y -q --no-install-recommends $pkgs" > /tmp/pw-deps.log 2>&1; then
              ok=1; tail -1 /tmp/pw-deps.log
            else
              tail -2 /tmp/pw-deps.log; echo "library install failed or timed out (240s cap)"; clear_apt
            fi
          fi
          if [ -z "$ok" ]; then
            if timeout -k 10 200 sudo -E env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive python3 -m playwright install-deps webkit > /tmp/pw-deps.log 2>&1; then
              ok=1; tail -2 /tmp/pw-deps.log
            else
              tail -2 /tmp/pw-deps.log; echo "install-deps timed out or failed (200s cap)"; clear_apt
            fi
          fi
          if [ -n "$ok" ] && ls /var/cache/apt/archives/*.deb > /dev/null 2>&1; then
            mkdir -p ~/webkit-debs && cp /var/cache/apt/archives/*.deb ~/webkit-debs/ && echo "debs=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Save WebKit's libraries to cache
        if: steps.browser.outputs.debs == '1' && steps.debcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/webkit-debs
          key: webkit-debs-noble-pw1.56.0-${{ steps.month.outputs.month }}
      - name: Check and repair
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          git show FETCH_HEAD:tools/watchdog.py > /tmp/watchdog.py
          mkdir -p data
          python3 /tmp/watchdog.py data/watchdog.json
      - name: Save status
        run: |
          if [ -f /tmp/wd_changed ]; then
            git config user.name maplefm
            git config user.email maplefm@users.noreply.github.com
            git add -f data/watchdog.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Watchdog status"
              for i in 1 2 3; do git pull --rebase -q origin live && git push -q origin HEAD:live && break; sleep 5; done
            fi
          fi
