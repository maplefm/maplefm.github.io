name: Weekly digest
# Sunday evening: the week on the Free Market, one card to the Club FM Discord.
on:
  schedule:
    - cron: "23 22 * * 0"       # Sundays about 6 PM Eastern
  workflow_dispatch:
permissions:
  contents: read
env:
  DISCORD_HOOKS: ${{ secrets.DISCORD_HOOKS }}
  DISCORD_HOOK_DIGEST: ${{ secrets.DISCORD_HOOK_DIGEST }}
  DISCORD_HOOK_MEMBERS: ${{ secrets.DISCORD_HOOK_MEMBERS }}
jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch -q origin live
          git show origin/live:data/report.json > /tmp/report.json
          git show origin/live:data/ranks.json > /tmp/ranks.json
          curl -fsSL -H "Authorization: token ${ARCHIVE_TOKEN}" https://raw.githubusercontent.com/maplefm/clubfm-archive/live/data/discord_weekly.json -o /tmp/weekly.json 2>/dev/null || echo '{}' > /tmp/weekly.json
          python3 tools/discord.py weekly /tmp/report.json /tmp/ranks.json /tmp/weekly.json
          # the members-only recap: item movers and the best deals caught, from the private data
          A="https://raw.githubusercontent.com/maplefm/clubfm-archive/live/data"
          curl -fsSL -H "Authorization: token ${ARCHIVE_TOKEN}" $A/summary.json -o /tmp/summary.json || echo '{}' > /tmp/summary.json
          curl -fsSL -H "Authorization: token ${ARCHIVE_TOKEN}" $A/discord_dealfeed.json -o /tmp/feed.json || echo '[]' > /tmp/feed.json
          echo '{}' > /tmp/members.json
          if [ -n "$DISCORD_HOOK_MEMBERS" ]; then python3 tools/discord.py members /tmp/summary.json /tmp/feed.json /tmp/members.json; fi
