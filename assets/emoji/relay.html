<!doctype html><meta charset="utf-8"><title>Emoji relay</title>
<body style="background:#222;color:#ccc;font:14px sans-serif">Sending emoji files to Discord...
<script>
// Opened from a Discord tab while managing the server's emojis: hands the listed mob emoji files back to it.
// Public images only, and only ever posted to discord.com.
(async function () {
  var names = decodeURIComponent(location.hash.slice(1)).split(",").filter(function (n) { return /^[a-z0-9_]+\.(gif|png)$/.test(n); });
  var out = [];
  for (var i = 0; i < names.length; i++) {
    var r = await fetch("mobs/" + names[i] + "?v=" + Date.now()); if (!r.ok) continue;
    out.push({ name: names[i], type: r.headers.get("Content-Type") || "", buf: await r.arrayBuffer() });
  }
  if (window.opener) window.opener.postMessage({ clubfmEmoji: out }, "https://discord.com");
  document.body.textContent = "Sent " + out.length + " files. You can close this tab.";
})();
</script>
