<!doctype html><meta charset="utf-8"><title>Emoji relay</title>
<body style="background:#222;color:#ccc;font:14px sans-serif">Sending emoji files to Discord...
<script>
// Opened from a Discord tab while managing the server's emojis: hands the listed mob emoji files back to it.
// Public images only, and only ever posted to discord.com.
(async function () {
  // "jrnecki.gif" is a mob emoji, "/crown.png" an emoji in this folder, "icon" the 512 server icon
  // "@kofi" first hands the files to a ko-fi.com tab instead of discord.com
  var raw = decodeURIComponent(location.hash.slice(1)), to = "https://discord.com";
  if (raw.indexOf("@kofi,") === 0) { to = "https://ko-fi.com"; raw = raw.slice(6); }
  var names = raw.split(",").filter(function (n) { return /^\/?(anim\/)?[a-z0-9_]+\.(gif|png)$/.test(n) || n === "icon" || n === "cover"; });
  var out = [];
  for (var i = 0; i < names.length; i++) {
    var n = names[i], url = n === "icon" ? "../../clubfm-icon-512.png" : n === "cover" ? "../kofi-cover.png" : n[0] === "/" ? n.slice(1) : "mobs/" + n;
    var r = await fetch(url + "?v=" + Date.now()); if (!r.ok) continue;
    out.push({ name: n === "icon" ? "clubfm-icon-512.png" : n === "cover" ? "kofi-cover.png" : n.replace(/^\/?(anim\/)?/, ""), type: r.headers.get("Content-Type") || "", buf: await r.arrayBuffer() });
  }
  if (window.opener) window.opener.postMessage({ clubfmEmoji: out }, to);
  document.body.textContent = "Sent " + out.length + " files. You can close this tab.";
})();
</script>
